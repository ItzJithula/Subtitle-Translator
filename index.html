							<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIT-X | Puter Ultimate AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://js.puter.com/v2/"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&amp;family=Noto+Sans+Sinhala:wght@400;700&amp;family=Space+Grotesk:wght@300;700&amp;display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #22d3ee;
            --bg: #010409;
        }
        body {
            font-family: 'Inter', 'Noto Sans Sinhala', sans-serif;
            background-color: var(--bg);
            color: #f0f6fc;
            overflow-x: hidden;
            min-height: 100vh;
        }
        .font-grotesk { font-family: 'Space Grotesk', sans-serif; }
        
        /* Animated Gradient Background */
        .bg-gradient {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: 
                radial-gradient(circle at 10% 20%, rgba(34, 211, 238, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(34, 211, 238, 0.03) 0%, transparent 40%);
            z-index: -1;
        }

        .glass {
            background: rgba(13, 17, 23, 0.8);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
        }

        .upload-card:hover {
            border-color: var(--accent);
            transform: translateY(-5px);
            box-shadow: 0 0 30px rgba(34, 211, 238, 0.1);
        }

        .btn-puter {
            background: var(--accent);
            color: #010409;
            font-weight: 800;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-transform: uppercase;
            letter-spacing: 0.2em;
        }
        .btn-puter:hover:not(:disabled) {
            filter: brightness(1.1);
            transform: scale(1.02);
            box-shadow: 0 0 20px var(--accent);
        }

        .progress-fill {
            background: var(--accent);
            box-shadow: 0 0 15px var(--accent);
            transition: width 0.4s cubic-bezier(0.1, 0.7, 0.1, 1);
        }

        .log-entry { 
            animation: slideIn 0.3s ease-out forwards;
            padding: 2px 0;
            border-left: 1px solid transparent;
        }
        .log-entry:hover {
            border-left-color: var(--accent);
            background: rgba(255,255,255,0.02);
            padding-left: 8px;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-10px); }
            to { opacity: 1; transform: translateX(0); }
        }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #30363d; border-radius: 10px; }
    </style>
</head>
<body class="p-6 md:p-12">

    <div class="bg-gradient"></div>

    <div class="max-w-6xl mx-auto relative z-10">
        <!-- Header -->
        <header id="mainHeader" class="flex flex-col md:flex-row justify-between items-center mb-16 gap-8 opacity-0">
            <div class="flex items-center gap-6">
                <div class="w-20 h-20 bg-cyan-400 rounded-3xl flex items-center justify-center rotate-3 shadow-2xl shadow-cyan-400/20" id="logoIcon">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-12 h-12 text-black" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
                </div>
                <div>
                    <h1 class="text-5xl font-black font-grotesk tracking-tighter text-white uppercase italic leading-none">BIT-X <span class="text-cyan-400 font-bold">PUTER.AI</span></h1>
                    <p class="text-[10px] text-zinc-500 tracking-[0.8em] font-black mt-3 uppercase">Master Neural Localization</p>
                </div>
            </div>
            
            <div class="px-8 py-3 rounded-full border border-zinc-800 bg-zinc-900/50">
                <div class="flex items-center gap-3">
                    <div class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></div>
                    <span class="text-[10px] font-black text-emerald-500 tracking-widest uppercase italic">Puter.js V2 Active</span>
                </div>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-10">
            <!-- Sidebar -->
            <div class="lg:col-span-4 space-y-8" id="leftPanel">
                <div class="glass upload-card rounded-[32px] p-8 transition-all cursor-pointer" id="dropZone">
                    <h3 class="text-[10px] font-black text-zinc-500 mb-8 uppercase tracking-widest flex items-center gap-3">
                        <span class="w-1.5 h-4 bg-cyan-400 rounded-full"></span> Subtitle Module
                    </h3>
                    <div class="text-center group">
                        <input type="file" id="fileInput" class="hidden" accept=".srt">
                        <div class="w-20 h-20 bg-zinc-900 rounded-2xl flex items-center justify-center mx-auto mb-6 border border-zinc-800 group-hover:scale-110 transition-transform shadow-xl">
                            <svg xmlns="http://www.w3.org/2000/svg" class="w-10 h-10 text-zinc-700 group-hover:text-cyan-400 transition-colors" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>
                        </div>
                        <p class="text-xl text-white font-black italic tracking-tighter uppercase">Drop SRT File</p>
                        <p id="fileNameDisplay" class="text-[10px] text-cyan-400 font-mono mt-3 truncate"></p>
                    </div>
                </div>

                <div class="glass rounded-[32px] p-8 space-y-6" id="settingsCard">
                    <div class="space-y-3">
                        <label class="text-[10px] text-zinc-600 uppercase font-black tracking-widest ml-1 italic">Neural Architecture</label>
                        <select id="modelSelect" class="w-full bg-black/60 border border-zinc-800 rounded-xl px-6 py-4 text-xs text-zinc-300 outline-none focus:border-cyan-400 transition-all font-bold appearance-none cursor-pointer">
                            <option value="gemini-2.5-flash" selected="">Gemini 3.5 Flash (Latest)</option>
                            <option value="gemini-1.5-pro">Gemini 1.5 Pro</option>
                            <option value="gpt-4o">GPT-4o (Omni)</option>
                            <option value="gpt-4o-mini">GPT-4o Mini</option>
                            <option value="claude-3-5-sonnet-latest">Claude 3.5 Sonnet</option>
                            <option value="claude-3-opus-latest">Claude 3 Opus</option>
                            <option value="llama-3.1-405b">Llama 3.1 405B</option>
                            <option value="llama-3.1-70b">Llama 3.1 70B</option>
                            <option value="mistral-large-latest">Mistral Large 2</option>
                        </select>
                    </div>
                    <div class="space-y-3">
                        <label class="text-[10px] text-zinc-600 uppercase font-black tracking-widest ml-1 italic">Artistic Persona</label>
                        <select id="style" class="w-full bg-black/60 border border-zinc-800 rounded-xl px-6 py-4 text-xs text-zinc-300 outline-none focus:border-cyan-400 transition-all font-bold appearance-none cursor-pointer">
                            <option value="funny">Funny &amp; Witty Editor (Natural)</option>
                            <option value="dramatic">Serious Cinematic Poet (Formal)</option>
                        </select>
                    </div>
                    <button id="translateBtn" disabled="" class="btn-puter w-full py-6 rounded-2xl text-[10px] shadow-2xl disabled:opacity-5">
                        Ignite Neural Engine
                    </button>
                </div>
            </div>

            <!-- Dashboard -->
            <div class="lg:col-span-8 space-y-8" id="rightPanel">
                <div class="glass rounded-[40px] overflow-hidden flex flex-col h-full min-h-[600px] border border-white/5 relative">
                    <div class="p-8 border-b border-zinc-800 flex justify-between items-center bg-white/[0.02]">
                        <div class="flex items-center gap-4">
                            <div class="w-2.5 h-2.5 rounded-full bg-cyan-400 shadow-[0_0_12px_#22d3ee] animate-pulse"></div>
                            <h3 class="text-[10px] font-black text-zinc-400 uppercase tracking-[0.4em]">Neural Stream Log</h3>
                        </div>
                        <div id="progressText" class="text-[10px] font-mono text-cyan-400 font-bold bg-cyan-400/10 px-4 py-2 rounded-xl">CORE: READY</div>
                    </div>
                    
                    <div class="h-1 bg-zinc-950 w-full relative">
                        <div id="progressFill" class="h-full progress-fill w-0"></div>
                    </div>

                    <div id="logOutput" class="flex-1 p-10 font-mono text-[12px] overflow-y-auto space-y-1 text-zinc-600 leading-relaxed scrollbar-hide">
                        <div class="text-zinc-800 italic">&gt; BIT-X Master engine initialized. Awaiting data stream...</div>
                    </div>

                    <div id="resultArea" class="hidden p-10 bg-black/80 border-t border-zinc-800 backdrop-blur-2xl">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                            <div class="space-y-4">
                                <p class="text-[9px] font-black text-zinc-700 uppercase tracking-widest ml-1 italic">Input (EN)</p>
                                <div id="prevOrig" class="p-6 bg-zinc-900/40 rounded-3xl border border-zinc-800 text-xs text-zinc-500 italic min-h-[60px]"></div>
                            </div>
                            <div class="space-y-4">
                                <p class="text-[9px] font-black text-cyan-700 uppercase tracking-widest ml-1 italic">Output (SI)</p>
                                <div id="prevEn" class="p-6 bg-cyan-400/5 rounded-3xl border border-cyan-400/20 text-xs text-white font-bold leading-relaxed min-h-[60px]"></div>
                            </div>
                        </div>
                        <button onclick="downloadSRT()" class="w-full py-5 bg-white text-black rounded-2xl text-[10px] font-black uppercase tracking-[0.4em] hover:bg-cyan-400 hover:text-white transition-all shadow-2xl">
                            Export Production Master
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let srtBlocks = [];
        let translatedBlocks = [];
        let targetFileName = "bitx_puter_master.srt";

        const fileInput = document.getElementById('fileInput');
        const dropZone = document.getElementById('dropZone');
        const translateBtn = document.getElementById('translateBtn');
        const logOutput = document.getElementById('logOutput');
        const progressFill = document.getElementById('progressFill');
        const progressText = document.getElementById('progressText');
        const resultArea = document.getElementById('resultArea');

        // Intro
        window.addEventListener('DOMContentLoaded', () => {
            gsap.to("#mainHeader", { opacity: 1, y: 0, duration: 1.2, ease: "expo.out" });
            gsap.from("#leftPanel", { x: -30, opacity: 0, duration: 1, delay: 0.2 });
            gsap.from("#rightPanel", { x: 30, opacity: 0, duration: 1, delay: 0.2 });
        });

        dropZone.onclick = () => fileInput.click();
        fileInput.onchange = (e) => handleFile(e.target.files[0]);

        function handleFile(file) {
            if (!file || !file.name.endsWith('.srt')) return;
            targetFileName = file.name.replace('.srt', '_Localized.srt');
            document.getElementById('fileNameDisplay').innerText = `READY: ${file.name}`;
            const reader = new FileReader();
            reader.onload = (e) => {
                srtBlocks = parseSRT(e.target.result);
                addLog(`Inbound data parsed. Found ${srtBlocks.length} subtitle units.`, "text-cyan-400 font-bold");
                translateBtn.disabled = false;
            };
            reader.readAsText(file);
        }

        function parseSRT(data) {
            const raw = data.replace(/\r\n/g, '\n').trim();
            return raw.split(/\n\s*\n/).map(seg => {
                const lines = seg.trim().split('\n');
                return lines.length >= 3 ? { id: lines[0], time: lines[1], text: lines.slice(2).join('\n') } : null;
            }).filter(x => x);
        }

        function addLog(msg, color = "text-zinc-700") {
            const div = document.createElement('div');
            div.className = `log-entry ${color}`;
            div.innerHTML = `<span class="opacity-10 mr-3">></span> ${msg}`;
            logOutput.appendChild(div);
            logOutput.scrollTop = logOutput.scrollHeight;
        }

        async function aiTranslate(originalTexts, style, model) {
            const persona = style === 'funny' 
                ? "You are a 'Witty Sinhala Cinematic Editor'. Translate English subtitles into natural, funny, and native spoken Sinhala dialogue."
                : "You are a 'Serious Cinematic Poet'. Translate English subtitles into formal, beautiful, and dramatic cinematic Sinhala.";

            const content = originalTexts.map((orig, i) => `[${i+1}] EN: ${orig}`).join('\n');
            const systemPrompt = `PERSONA: ${persona}\nTASK: Translate English subtitles into perfect Sinhala.\nRULES:\n1. Maintain HTML tags (<i>, etc.).\n2. Output format: [number] Translated Text.\n3. NO English, NO notes, NO small talk.`;

            try {
                // Internal model mapping for Puter
                const response = await puter.ai.chat(systemPrompt + "\n\nSUBTITLES:\n" + content, { model: model });
                const resultText = response.toString();
                
                const finalLines = new Array(originalTexts.length).fill("");
                resultText.split('\n').forEach(line => {
                    const m = line.match(/^\[(\d+)\]\s*(.*)/);
                    if (m) {
                        const idx = parseInt(m[1]) - 1;
                        if (idx >= 0 && idx < finalLines.length) finalLines[idx] = m[2].trim();
                    }
                });
                return finalLines.map((l, i) => l || originalTexts[i]);
            } catch (err) {
                console.error(err);
                return originalTexts;
            }
        }

        translateBtn.onclick = async () => {
            translateBtn.disabled = true;
            const model = document.getElementById('modelSelect').value;
            const style = document.getElementById('style').value;
            const total = srtBlocks.length;
            translatedBlocks = [];
            
            addLog(`Direct AI Ingress Started... Neural Engine: ${model}`, "text-cyan-400 font-black italic uppercase tracking-widest");
            resultArea.classList.remove('hidden');
            gsap.from(resultArea, { opacity: 0, y: 30, duration: 0.8 });

            const batchSize = 30; 

            for (let i = 0; i < total; i += batchSize) {
                const batch = srtBlocks.slice(i, i + batchSize);
                const batchNum = Math.floor(i / batchSize) + 1;
                const totalBatches = Math.ceil(total / batchSize);

                progressText.innerText = `PHASE ${batchNum}/${totalBatches}`;
                addLog(`[Batch ${batchNum}] Running pure AI localization...`, "text-zinc-600");
                
                const translatedTexts = await aiTranslate(batch.map(b => b.text), style, model);

                batch.forEach((block, idx) => {
                    translatedBlocks.push({ ...block, text: translatedTexts[idx] });
                });

                const progress = ((i + batchSize) / total) * 100;
                gsap.to(progressFill, { width: `${progress}%`, duration: 0.5 });
                
                document.getElementById('prevOrig').innerText = batch[0].text;
                document.getElementById('prevEn').innerText = translatedTexts[0];
            }

            addLog("All neural sequences processed. AI Master Output ready.", "text-emerald-500 font-black uppercase tracking-widest");
            progressText.innerText = "COMPLETE";
            translateBtn.disabled = false;
        };

        function downloadSRT() {
            const content = translatedBlocks.map(b => `${b.id}\n${b.time}\n${b.text}`).join('\n\n');
            const blob = new Blob([content], { type: 'text/plain;charset=UTF-8' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = targetFileName;
            a.click();
        }
    </script>

</body></html>
