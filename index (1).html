							<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIT-X | Puter Powered Sub-Enhancer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Include Puter JS SDK -->
    <script src="https://js.puter.com/v2/"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;family=Noto+Sans+Sinhala:wght@400;700&amp;display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #06b6d4;
            --accent-glow: rgba(6, 182, 212, 0.3);
        }
        body {
            font-family: 'Inter', 'Noto Sans Sinhala', sans-serif;
            background-color: #020617;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(6, 182, 212, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 0% 100%, rgba(6, 182, 212, 0.05) 0%, transparent 50%);
            color: #f8fafc;
            min-height: 100vh;
        }
        .glass {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .btn-primary { background: var(--accent); transition: all 0.3s ease; }
        .btn-primary:hover { box-shadow: 0 0 20px var(--accent); transform: translateY(-1px); }
        .progress-fill { transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-5xl mx-auto">
        <!-- Header -->
        <header class="flex flex-col md:flex-row justify-between items-center mb-10 gap-4">
            <div class="flex items-center gap-3">
                <div class="w-12 h-12 bg-cyan-500 rounded-xl flex items-center justify-center shadow-lg shadow-cyan-500/20">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-7 h-7 text-slate-950" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"></path><path d="M19 12H5"></path></svg>
                </div>
                <div>
                    <h1 class="text-2xl font-bold tracking-tight text-white uppercase">BIT-X <span class="text-cyan-500">Sub-Enhancer</span></h1>
                    <p class="text-xs text-slate-400 tracking-[0.2em] font-medium">UNLIMITED PUTER.AI ENGINE</p>
                </div>
            </div>
            <div class="flex items-center gap-2 px-4 py-2 rounded-full glass border border-cyan-500/30">
                <div class="w-2 h-2 bg-purple-500 rounded-full animate-pulse"></div>
                <span class="text-[10px] font-mono text-purple-400 uppercase">Stage: Puter AI Enhancement</span>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="lg:col-span-1 space-y-6">
                <!-- Source Upload -->
                <div class="glass rounded-2xl p-6">
                    <h3 class="text-sm font-semibold text-slate-300 mb-4 flex items-center gap-2 uppercase tracking-tighter">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-cyan-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                        Upload SRT
                    </h3>
                    <div id="dropZone" class="border-2 border-dashed border-slate-700 rounded-xl p-8 text-center hover:border-cyan-500/50 transition-colors cursor-pointer group">
                        <input type="file" id="fileInput" class="hidden" accept=".srt">
                        <p class="text-sm text-slate-400 font-medium">Drop your subtitle file or <span class="text-cyan-500 font-bold">browse</span></p>
                        <p id="fileNameDisplay" class="text-[10px] text-cyan-400 mt-2 font-mono truncate"></p>
                    </div>
                </div>

                <!-- Settings -->
                <div class="glass rounded-2xl p-6">
                    <h3 class="text-sm font-semibold text-slate-300 mb-4 uppercase tracking-tighter">Optimization</h3>
                    <div class="space-y-4">
                        <div>
                            <label class="text-[10px] text-slate-500 uppercase tracking-widest block mb-1">Batch Size</label>
                            <select id="batchSize" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-300 outline-none">
                                <option value="10">10 Lines (Highest Quality)</option>
                                <option value="25" selected="">25 Lines (Standard)</option>
                            </select>
                        </div>
                        <div>
                            <label class="text-[10px] text-slate-500 uppercase tracking-widest block mb-1">AI Tone</label>
                            <select id="style" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-300 outline-none">
                                <option value="conversational">Natural &amp; Funny (කතාකරන විදියට)</option>
                                <option value="formal">Literary &amp; Formal (පොතේ භාෂාවෙන්)</option>
                                <option value="slang">Slang &amp; Cool (අළුත් විදියට)</option>
                            </select>
                        </div>
                    </div>
                </div>

                <button id="translateBtn" disabled="" class="btn-primary w-full py-4 rounded-xl text-slate-950 font-bold uppercase tracking-widest text-sm disabled:opacity-30">
                    Enhance With Puter.ai
                </button>
            </div>

            <div class="lg:col-span-2 space-y-6">
                <!-- Live Dashboard -->
                <div class="glass rounded-2xl overflow-hidden flex flex-col h-full min-h-[500px]">
                    <div class="p-4 border-b border-white/5 flex justify-between items-center bg-white/5">
                        <h3 class="text-xs font-bold text-slate-400 uppercase tracking-widest">Puter Processing Engine</h3>
                        <div id="progressText" class="text-[10px] font-mono text-cyan-500">STANDBY</div>
                    </div>
                    
                    <div class="h-1 bg-slate-800 w-full flex">
                        <div id="progressFill" class="h-full bg-cyan-500 shadow-[0_0_10px_#06b6d4] w-0 progress-fill"></div>
                    </div>

                    <div id="logOutput" class="flex-1 p-6 font-mono text-[11px] overflow-y-auto space-y-1 text-slate-400">
                        <div class="text-slate-600 italic">&gt; Welcome. Upload a file to begin the dual-engine enhancement.</div>
                    </div>

                    <div id="resultArea" class="hidden p-6 bg-slate-900/80 border-t border-white/5">
                        <div class="grid grid-cols-2 gap-3 mb-4">
                            <div class="p-3 bg-slate-950 rounded border border-slate-800">
                                <div class="text-[9px] text-slate-600 mb-1">NORMAL GOOGLE BASE</div>
                                <div id="prevBase" class="text-[11px] line-clamp-2 text-slate-400 italic"></div>
                            </div>
                            <div class="p-3 bg-slate-950 rounded border border-cyan-900/30">
                                <div class="text-[9px] text-cyan-600 mb-1">PUTER AI ENHANCED</div>
                                <div id="prevEn" class="text-[11px] line-clamp-2 text-cyan-100 font-bold"></div>
                            </div>
                        </div>
                        <button onclick="downloadSRT()" class="w-full py-3 bg-emerald-500/10 border border-emerald-500/50 text-emerald-400 rounded-xl text-xs font-bold uppercase tracking-widest hover:bg-emerald-500 hover:text-slate-950 transition-all">
                            Save Enhanced Subtitles
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let srtBlocks = [];
        let translatedBlocks = [];
        let targetFileName = "enhanced_subtitles.srt";

        // Element handles
        const fileInput = document.getElementById('fileInput');
        const dropZone = document.getElementById('dropZone');
        const translateBtn = document.getElementById('translateBtn');
        const logOutput = document.getElementById('logOutput');
        const progressFill = document.getElementById('progressFill');
        const progressText = document.getElementById('progressText');
        const resultArea = document.getElementById('resultArea');

        dropZone.onclick = () => fileInput.click();
        fileInput.onchange = (e) => handleFile(e.target.files[0]);

        function handleFile(file) {
            if (!file || !file.name.endsWith('.srt')) return;
            targetFileName = file.name.replace('.srt', '_puter_enhanced.srt');
            document.getElementById('fileNameDisplay').innerText = file.name;
            const reader = new FileReader();
            reader.onload = (e) => {
                srtBlocks = parseSRT(e.target.result);
                addLog(`File analysis complete: ${srtBlocks.length} subtitle units found.`, "text-emerald-500");
                translateBtn.disabled = false;
            };
            reader.readAsText(file);
        }

        function parseSRT(data) {
            const raw = data.replace(/\r\n/g, '\n').trim();
            return raw.split(/\n\s*\n/).map(seg => {
                const lines = seg.trim().split('\n');
                return lines.length >= 3 ? { id: lines[0], time: lines[1], text: lines.slice(2).join('\n') } : null;
            }).filter(x => x);
        }

        function addLog(msg, color = "text-slate-500") {
            const div = document.createElement('div');
            div.className = color;
            div.innerHTML = `<span class="opacity-30 mr-2">></span> ${msg}`;
            logOutput.appendChild(div);
            logOutput.scrollTop = logOutput.scrollHeight;
        }

        // STAGE 1: Fast Base Translation
        async function googleTranslate(text) {
            try {
                const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=si&dt=t&q=${encodeURIComponent(text)}`;
                const res = await fetch(url);
                const data = await res.json();
                return data[0].map(x => x[0]).join('');
            } catch (e) {
                return text;
            }
        }

        // STAGE 2: Puter AI Enhancement
        async function puterEnhance(originalTexts, baseTranslations, style) {
            const stylePrompts = {
                conversational: "Re-write the Sinhala to be funny and natural spoken language.",
                formal: "Re-write the Sinhala to be formal, respectful, and literary.",
                slang: "Re-write the Sinhala using modern cool slang and natural youth expressions."
            };

            const dataToProcess = originalTexts.map((orig, i) => `[${i+1}] Original English: ${orig} | Google Translation: ${baseTranslations[i]}`).join('\n');
            
            const prompt = `You are a professional subtitle translator. You are given English subtitle lines and a basic Google translation into Sinhala.
Your goal is to RE-WRITE the Sinhala to be perfect and natural.

Rules:
1. Preserve all HTML tags like <i>.
2. Tone: ${stylePrompts[style]}.
3. Format the response EXACTLY like this: [1] Enhanced Text
4. Return ONLY the enhanced Sinhala lines.

Subtitles:
${dataToProcess}`;

            try {
                // Using Puter AI SDK
                const response = await puter.ai.chat(prompt);
                const resultText = response.toString();
                
                const finalLines = new Array(originalTexts.length).fill("");
                resultText.split('\n').forEach(line => {
                    const m = line.match(/^\[(\d+)\]\s*(.*)/);
                    if (m) {
                        const idx = parseInt(m[1]) - 1;
                        if (idx >= 0 && idx < finalLines.length) finalLines[idx] = m[2].trim();
                    }
                });
                return finalLines.map((l, i) => l || baseTranslations[i]);
            } catch (err) {
                console.error("Puter AI Error:", err);
                return baseTranslations; // Fallback
            }
        }

        translateBtn.onclick = async () => {
            translateBtn.disabled = true;
            const batchSize = parseInt(document.getElementById('batchSize').value);
            const style = document.getElementById('style').value;
            const total = srtBlocks.length;
            translatedBlocks = [];
            
            addLog("Initializing Puter AI Engine...", "text-cyan-500 font-bold");

            for (let i = 0; i < total; i += batchSize) {
                const batch = srtBlocks.slice(i, i + batchSize);
                const batchNum = Math.floor(i / batchSize) + 1;
                const totalBatches = Math.ceil(total / batchSize);

                progressText.innerText = `PHASE ${batchNum}/${totalBatches}`;
                addLog(`Batch ${batchNum}: Generating base translation...`, "text-slate-400");
                
                // Parallel Google Translate
                const baseTranslations = await Promise.all(batch.map(b => googleTranslate(b.text)));
                
                addLog(`Batch ${batchNum}: AI Enhancement via Puter...`, "text-purple-400");
                
                // Puter AI Enhancement
                const enhancedTexts = await puterEnhance(batch.map(b => b.text), baseTranslations, style);

                batch.forEach((block, idx) => {
                    translatedBlocks.push({ ...block, text: enhancedTexts[idx] });
                });

                // Update UI
                progressFill.style.width = `${((i + batchSize) / total) * 100}%`;
                document.getElementById('prevBase').innerText = baseTranslations[0];
                document.getElementById('prevEn').innerText = enhancedTexts[0];
                resultArea.classList.remove('hidden');
            }

            addLog("Success! Subtitles have been enhanced and polished.", "text-emerald-500 font-bold");
            progressText.innerText = "COMPLETE";
            translateBtn.disabled = false;
        };

        function downloadSRT() {
            const content = translatedBlocks.map(b => `${b.id}\n${b.time}\n${b.text}`).join('\n\n');
            const blob = new Blob([content], { type: 'text/plain;charset=UTF-8' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = targetFileName;
            a.click();
        }
    </script>

</body></html>
